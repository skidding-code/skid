name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build (also copies the Pyodide runtime into dist)
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Serve the production build
        run: npm run preview -- --port 4173 &

      - name: Wait for the server
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:4173/ -o /dev/null && exit 0
            sleep 1
          done
          echo "preview server did not start" && exit 1

      - name: End-to-end (every lesson runs + grades in a real browser)
        run: npm run e2e

      - name: Offline PWA (app + Python run with the network cut)
        run: npm run e2e:offline
