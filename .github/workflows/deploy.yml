name: Deploy to GitHub Pages

# Publishes on every push to the working branch (the repo is public, so
# configure-pages can auto-enable Pages). Also runnable manually.
on:
  push:
    branches: ["claude/python-html-js-playground-GHJ2j"]
  workflow_dispatch:

# Allow this workflow to create a Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let an in-progress run finish (don't cancel prod).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build (relative base works at the Pages sub-path)
        run: npm run build

      - name: Configure Pages (auto-enables it on first run)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
